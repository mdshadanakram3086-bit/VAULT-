    .actions{display:flex;gap:6px;flex-wrap:wrap}.mono{font-family:"Space Mono",monospace;font-size:11px}

function replicationView(){return heading('Replication','Replica branch visualizations reveal how durability is maintained.',`<button class="btn btn-primary" data-action="reconcile">Reconcile Queue</button>`)+`<section class="dashboard-grid"><article class="panel"><div class="section-title">Replica placement graph</div><div class="section-sub">Target factor ${state.settings.replication}; paths are split across independent domains.</div><div class="flow-canvas" style="min-height:330px"><svg class="flow-svg" viewBox="0 0 900 280" preserveAspectRatio="none"><path class="trace" d="M120 140 C330 140 335 60 550 60 M120 140 C330 140 335 140 550 140 M120 140 C330 140 335 220 550 220"/><path class="trace trace-violet" d="M550 60 L750 60 M550 140 L750 140 M550 220 L750 220"/></svg><div class="stage-data" style="top:38%">OBJECT<br><span class="mono">OBJ_8F92</span></div><div class="stage-chunks" style="left:38%;top:37%">${[1,2,3,4].map(x=>`<div class="chunk"></div>`).join('')}</div><div class="storage-cluster" style="right:9%;top:19%;grid-template-columns:1fr;gap:22px"><div class="storage-node">Node-01 · R1</div><div class="storage-node">Node-04 · R2</div><div class="storage-node">Node-06 · R3</div></div></div></article><aside class="panel"><div class="section-title">Replication telemetry</div><div class="mini-readouts" style="grid-template-columns:1fr"><div class="readout"><div class="eyebrow">HEALTHY REPLICAS</div><strong>3 / 3</strong></div><div class="readout"><div class="eyebrow">UNDER-REPLICATED</div><strong style="color:#ffcf70">02</strong></div><div class="readout"><div class="eyebrow">QUEUE DEPTH</div><strong>04</strong></div></div></aside></section>`}
function repairView(){const fail=state.nodes.find(n=>n.status==='Failed')||state.nodes[2];return heading('Self-Healing','Checksum-driven recovery restores an independent replica without operator intervention.',`<div class="actions"><button class="btn btn-primary" data-action="repair-object" data-object="obj_82a1">Repair Object</button><button class="btn btn-amber" data-action="pause-repair">Pause Self-Repair</button></div>`)+`<section class="dashboard-grid"><article class="panel"><div class="section-title">Failure → verification → recovery scenario</div><div class="section-sub">Corrupted replica on ${fail.id}; healthy source is Node-05.</div><div class="repair-pipeline"><div class="repair-step bad">CORRUPTED REPLICA<div class="small" style="margin-top:13px;color:#ff9cab">${fail.id}<br>CHECKSUM MISMATCH</div></div><div class="repair-step done">VERIFY CHECKSUM<div class="small" style="margin-top:13px">EXPECTED HASH LOCKED</div></div><div class="repair-step done">FIND HEALTHY REPLICA<div class="small" style="margin-top:13px">SOURCE: NODE-05</div></div><div class="repair-step active">COPY CHUNK<div class="small" style="margin-top:13px">FLOWING 1 MB BLOCK</div></div><div class="repair-step done">VERIFY<div class="small" style="margin-top:13px">DESTINATION RECOVERS</div></div></div><div class="checksum-beam bad"><div class="beam-label">CORRUPTED REPLICA / b72e14... / ${fail.id}</div><div class="beam-result" style="color:#ff9eae">MISMATCH DETECTED</div></div></article><aside class="panel"><div class="section-title">Repair state</div><div class="health-dial" style="height:190px"><svg viewBox="0 0 160 160"><circle class="dial-bg" cx="80" cy="80" r="68"></circle><circle class="dial-main" cx="80" cy="80" r="68" style="stroke-dashoffset:102"></circle></svg><div class="dial-copy"><strong>76%</strong><span>COPY TRACE</span></div></div><div class="node-detail"><div class="detail-line"><span>Objects checked</span><b>1,248</b></div><div class="detail-line"><span>Missing replicas</span><b>7</b></div><div class="detail-line"><span>Avg repair time</span><b>1.8 sec</b></div><div class="detail-line"><span>Self-repair</span>${badge('Active')}</div></div></aside></section>`}
function integrityView(){
 const d=state.integrity||{objects:{total:0,healthy:0,percent:100},chunks:{checked:0,healthy:0,percent:100},replicas:{checked:0,healthy:0,percent:100},issues:[]};
 const pct=v=>Math.max(0,Math.min(100,Number(v)||0));
 const bar=(label,value,detail)=>`<div class="integrity-row"><div class="integrity-row-head"><span>${label}</span><b>${pct(value).toFixed(2)}%</b></div><div class="integrity-bar"><b style="width:${pct(value)}%"></b></div><div class="small integrity-detail">${detail}</div></div>`;
 const issues=d.issues||[];
 const issueRows=issues.slice(0,8).map(i=>`<div class="checksum-beam bad"><div class="beam-label">${escapeHtml(i.objectId)} · CHUNK ${String(i.index).padStart(4,'0')} · ${escapeHtml(i.nodeId||'unknown')}</div><div class="beam-result" style="color:#ffa0af">MISMATCH / ${escapeHtml(i.error||'REPAIR QUEUED')}</div></div>`).join('');
 return heading('Integrity','SHA-256 verification reflects the live state of every object, chunk, and replica.',`<button class="btn btn-primary" id="verifyAll">Verify All</button>`)
 +`<section class="dashboard-grid">
 <article class="panel"><div class="section-title">Live integrity coverage</div><div class="section-sub">Bars are calculated from the Vault backend; they are not demo values.</div>
 ${bar('OBJECT INTEGRITY',d.objects.percent,`${d.objects.healthy} of ${d.objects.total} objects healthy`)}
 ${bar('CHUNK INTEGRITY',d.chunks.percent,`${d.chunks.healthy} of ${d.chunks.checked} chunks verified`)}
 ${bar('REPLICA INTEGRITY',d.replicas.percent,`${d.replicas.healthy} of ${d.replicas.checked} replicas healthy`)}
 </article>
 <aside class="panel"><div class="section-title">Verification scope</div><div class="mini-readouts" style="grid-template-columns:1fr">
 <div class="readout"><div class="eyebrow">OBJECTS VERIFIED</div><strong>${d.objects.total}</strong></div>
 <div class="readout"><div class="eyebrow">CHUNKS VERIFIED</div><strong>${d.chunks.checked}</strong></div>
 <div class="readout"><div class="eyebrow">UNHEALTHY REPLICAS</div><strong style="color:${d.replicas.unhealthy?'#ff9aaa':'var(--green)'}">${d.replicas.unhealthy}</strong></div>
 </div></aside>
 </section>
 <section class="panel" style="margin-top:16px"><div class="section-title">Integrity exceptions</div><div class="section-sub">${issues.length?`${issues.length} issue(s) detected in the latest verification.`:'No checksum or replica integrity issues detected.'}</div>${issueRows||`<div class="checksum-beam"><div class="beam-label">ALL LIVE REPLICAS</div><div class="beam-result">MATCH / VERIFIED</div></div>`}</section>`;
}
function rebalancingView(){let before=[82,78,41,35,62,28],after=[61,63,58,57,60,55];let bars=(set,afterMode)=>set.map((v,i)=>`<div class="bar-row"><span>Node-0${i+1}</span><div class="bar"><b class="${!afterMode&&v>75?'red':''}" style="width:${v}%"></b></div><b>${v}%</b></div>`).join('');return heading('Rebalancing','Redistribute chunks to reduce capacity skew and increase recovery headroom.',`<button class="btn btn-primary" id="startRebalance">Start Rebalancing</button>`)+`<article class="panel"><div class="section-title">Capacity redistribution / before → after</div><div class="section-sub">12,842 chunks scheduled through independent storage lanes.</div><div class="balance-chart"><div><div class="eyebrow">BEFORE / SKEW DETECTED</div>${bars(before,false)}</div><div><div class="eyebrow">AFTER / TARGET DISTRIBUTION</div>${bars(after,true)}</div></div></div><div class="checksum-beam"><div class="beam-label">CHUNK MOVEMENT: NODE-01 / NODE-02 → NODE-03 / NODE-04 / NODE-06</div><div class="beam-result">8.4 GB / IN FLIGHT</div></div></article>`}
function networkView(){return heading('Network','Independent-node topology, latency monitoring, and fault-partition simulation.')+`<section class="dashboard-grid"><article class="panel"><div class="section-title">Connected network topology</div><div class="section-sub">Pulsing cyan paths carry replica traffic. Select a node to inspect its connectivity.</div>${nodeMap()}</article><aside class="panel">${selectedNodePanel()}</aside></section>`}
function logsView(){const types=['All','Replication','Repair','Integrity','Node','Network','Rebalancing'],logs=state.events.filter(e=>state.logFilter==='All'||e.type===state.logFilter);return heading('Activity Logs','Searchable stream of distributed storage operations.',`<select class="btn" id="logFilter">${types.map(x=>`<option ${x===state.logFilter?'selected':''}>${x}</option>`).join('')}</select>`)+`<article class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>TIMESTAMP</th><th>EVENT</th><th>OBJECT</th><th>NODE</th><th>SEVERITY</th><th>ACTION</th></tr></thead><tbody>${logs.map(e=>`<tr><td class="mono">${e.time}</td><td><b>${e.event}</b></td><td class="mono">${e.object}</td><td>${e.node}</td><td>${badge(e.severity)}</td><td><button class="btn btn-sm" data-action="log-details" data-event="${e.event}">View Details</button></td></tr>`).join('')}</tbody></table></div></article>`}
function settingsView(){return heading('Settings','Configure operational policies for this demonstration session.',`<button class="btn btn-primary" id="saveSettings">Save Settings</button>`)+`<article class="panel">${[['replication','Replication Factor',['1x','2x','3x','4x']],['chunk','Chunk Size',['1 MB','4 MB','8 MB','16 MB']]].map(x=>`<div class="setting-row"><div><b>${x[1]}</b><div class="small" style="margin-top:4px">Distributed placement policy for this demonstration.</div></div><div class="segmented" data-setting="${x[0]}">${x[2].map(v=>`<button class="btn ${state.settings[x[0]]===v?'selected':''}" data-value="${v}">${v}</button>`).join('')}</div></div>`).join('')}${[['integrity','Integrity Verification'],['repair','Self Repair'],['rebalancing','Background Rebalancing']].map(x=>`<div class="setting-row"><div><b>${x[1]}</b><div class="small" style="margin-top:4px">Enable continuous cluster automation.</div></div><button class="switch ${state.settings[x[0]]?'on':''}" data-toggle="${x[0]}" aria-pressed="${state.settings[x[0]]}"><i></i></button></div>`).join('')}</article>`}
function render(){
 nav();const views={Dashboard:dashboard,Objects:objectsView,'Object Detail':detailView,'Storage Nodes':nodesView,Replication:replicationView,'Self Repair':repairView,Integrity:integrityView,Rebalancing:rebalancingView,Network:networkView,'Activity Logs':logsView,Settings:settingsView};
 appMain.innerHTML=views[state.route]();routeTitle.textContent=state.route;routeSub.textContent=state.route==='Dashboard'?'DISTRIBUTED CONTROL PLANE':'VAULT CONTROL PLANE';lucide.createIcons();
}
function toast(msg){toastText.textContent=msg;const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}
function confirmAction(title,text,cb){state.pendingAction=cb;modalTitle.textContent=title;modalText.textContent=text;modalLayer.classList.remove('hidden')}
function nodeAction(action,id){const n=state.nodes.find(x=>x.id===id);if(action==='fail'){n.status='Failed';n.network='Offline';n.heartbeat='just now';addEvent('NODE FAILURE SIMULATED','—',id,'Warning','Node');toast(`${id} is offline. Replica recovery has been queued.`)}if(action==='recover'){n.status='Healthy';n.network='Connected';n.heartbeat='just now';n.cpu='35%';n.used='22.4 GB / 10 GB';n.pct=44.8;addEvent('NODE RECOVERED','—',id,'Success','Node');toast(`${id} recovered and rejoined the cluster.`)}if(action==='partition'){n.partition=true;n.network='Partitioned';addEvent('NETWORK PARTITION DETECTED','—',id,'Warning','Network');toast(`${id} is isolated; consistency safeguards are active.`)}if(action==='heal'){n.partition=false;n.network='Connected';addEvent('NETWORK PARTITION HEALED','—',id,'Success','Network');toast(`${id} partition has been healed.`)}render()}
document.addEventListener('click',e=>{
 const r=e.target.closest('[data-route]');if(r){state.route=r.dataset.route;sidebar.classList.remove('open');render();return}
 const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action,id=a.dataset.node,obj=a.dataset.object;
 if(['fail','partition'].includes(action)){confirmAction(action==='fail'?'Fail storage node?':'Create network partition?',`${id} will enter a simulated ${action==='fail'?'failure':'partition'} state.`,()=>nodeAction(action,id));return}

 if(action==='select-node'){state.selectedNode=id;render();return}
 if(action==='node-details'){state.selectedNode=id;state.route='Network';render();return}
 if(action==='metadata'){state.route='Object Detail';render();return}
 if(action==='download'){addEvent('MULTI-NODE RETRIEVAL REQUESTED',obj,'Node-01','Info','Node');toast('Download prepared from healthy replicas.');return}
 if(action==='verify-object'){toast('SHA-256 verification started for selected object.');setTimeout(()=>{addEvent('OBJECT INTEGRITY VERIFIED',obj,'Cluster','Success','Integrity');toast('Integrity verification completed.');render()},900);return}
 if(action==='repair-object'){const o=state.objects.find(x=>x.id===obj);if(o)o.status='Healthy';addEvent('OBJECT REPAIR COMPLETED',obj,'Node-05','Success','Repair');toast('Healthy replica copied and destination verification completed.');render();return}
 if(action==='reconcile'){toast('Reconciling replica queue...');setTimeout(()=>{addEvent('REPLICATION QUEUE RECONCILED','—','Cluster','Success','Replication');toast('Replication queue reconciled.');render()},900);return}
 if(action==='pause-repair'){toast('Self-repair paused for this demonstration session.');return}
 if(action==='log-details'){toast(`Event detail: ${a.dataset.event}`)}
});

modalConfirm.onclick=()=>{const cb=state.pendingAction;modalLayer.classList.add('hidden');state.pendingAction=null;if(cb)cb()};
menuToggle.onclick=()=>sidebar.classList.toggle('open');

document.addEventListener('change',e=>{if(e.target.id==='logFilter'){state.logFilter=e.target.value;render()}/* filePicker is handled by the backend bridge below */});
document.addEventListener('click',e=>{
 if(e.target.id==='verifyAll'){e.target.disabled=true;e.target.textContent='Verifying 1,248 objects...';setTimeout(()=>{addEvent('GLOBAL INTEGRITY VERIFICATION COMPLETE','—','Cluster','Success','Integrity');toast('All objects verified. Three repair cases remain queued.');render()},1200)}
 if(e.target.id==='startRebalance'){e.target.disabled=true;e.target.textContent='Rebalancing in progress...';setTimeout(()=>{addEvent('REBALANCING CYCLE COMPLETED','—','Cluster','Success','Rebalancing');toast('Rebalancing completed: 8.4 GB redistributed.');render()},1200)}
 if(e.target.id==='saveSettings'){addEvent('CLUSTER SETTINGS SAVED','—','Cluster','Success','Node');toast('Settings saved for this session.')}
 const seg=e.target.closest('[data-setting] button');if(seg){state.settings[seg.parentElement.dataset.setting]=seg.dataset.value;render()}
 const tog=e.target.closest('[data-toggle]');if(tog){state.settings[tog.dataset.toggle]=!state.settings[tog.dataset.toggle];render()}
});
notificationButton.onclick=()=>toast('3 operational notifications: 1 node offline, 2 under-replicated objects.');
globalSearch.addEventListener('keydown',e=>{if(e.key==='Enter'){state.route='Objects';state.objectFilter=e.target.value;render()}});
render();

<script>
/* VAULT BACKEND BRIDGE
   Connects this Canva-exported interface to the local Vault REST API. */
const VAULT_API = '';

function escapeHtml(value){return String(value??'').replace(/[&<>\"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));}
function humanBytes(n){
  n=Number(n)||0;
  const units=['B','KB','MB','GB','TB']; let i=0;
  while(n>=1024 && i<units.length-1){n/=1024;i++;}
  return `${n.toFixed(i?1:0)} ${units[i]}`;
}
async function api(path, options={}){
  const res=await fetch(VAULT_API+path, options);
  const ct=res.headers.get('content-type')||'';
  const body=ct.includes('application/json') ? await res.json() : await res.text();
  if(!res.ok) throw new Error(body?.error || body || `HTTP ${res.status}`);
  return body;
}
function nodeFromApi(n){
  const failed=!n.online, partitioned=!!n.partitioned;
  return {
    id:n.id.replace(/^node-/,'Node-'), apiId:n.id,
    status:failed?'Failed':partitioned?'Partitioned':'Healthy',
    cpu:'—', used:humanBytes(n.usedBytes)+' / '+humanBytes(n.capacityBytes),
    pct:Number(n.utilization||0), objects:'—', load:'—',
    network:failed?'Offline':partitioned?'Partitioned':'Connected',
    heartbeat:n.lastHeartbeat?new Date(n.lastHeartbeat).toLocaleTimeString():'—',
    latency:'—', partition:partitioned, role:'distributed storage node'
  };
}
function objectFromApi(o){
  const replicas=[...new Set((o.chunks||[]).flatMap(c=>c.replicas||[]))];
  return {
    name:o.originalName||o.objectId, id:o.objectId, size:humanBytes(o.size),
    chunks:String(o.chunkCount||o.chunks?.length||0),
    replication:(o.replicationFactor||3)+'x',
    checksum:(o.objectChecksum||'').slice(0,12)+'...',
    checksumFull:o.objectChecksum, status:'Healthy',
    created:o.createdAt?new Date(o.createdAt).toLocaleString():'—',
    nodes:replicas.map(x=>x.replace(/^node-/,'Node-'))
  };
}
async function refreshVault({rerender=true}={}){
  try{
    const [health, stats, nodes, objects, integrity] = await Promise.all([
      api('/api/health'), api('/api/stats'), api('/api/nodes'), api('/api/objects'), api('/api/integrity/summary')
    ]);
    state.backend={health,stats};
    state.integrity=integrity;
    state.nodes=(nodes.nodes||[]).map(nodeFromApi);
    state.objects=(objects.objects||[]).map(objectFromApi);
    state.settings.replication=Number(stats.replicationFactor||3)+'x';
    state.backendFaultTolerance=stats.nodeCount ? Math.round(stats.healthyNodes/stats.nodeCount*100) : 0;
    if(!state.selectedNode || !state.nodes.some(n=>n.id===state.selectedNode))
      state.selectedNode=state.nodes[0]?.id||'Node-01';
    if(rerender) render();
  }catch(e){
    console.error('Vault backend refresh:',e);
    toast('Backend connection error: '+e.message);
  }
}
async function backendNodeAction(action,id){
  const apiId=id.toLowerCase().replace('node-','node-');
  const map={
    fail:`/api/nodes/${apiId}/fail`, recover:`/api/nodes/${apiId}/recover`,
    partition:`/api/nodes/${apiId}/partition`, heal:`/api/nodes/${apiId}/heal-partition`
  };
  try{
    await api(map[action],{method:'POST'});
    addEvent(action==='fail'?'NODE FAILURE':action==='recover'?'NODE RECOVERED':
      action==='partition'?'NETWORK PARTITION DETECTED':'NETWORK PARTITION HEALED',
      '—',id,(action==='fail'||action==='partition')?'Warning':'Success',
      (action==='partition'||action==='heal')?'Network':'Node');
    await refreshVault();
    toast(`${id}: ${action} completed on backend.`);
  }catch(e){toast('Action failed: '+e.message)}
}
async function backendUpload(file){
  if(!file) return;
  if(file.size===0){ toast('The selected file is empty. Choose a non-empty file.'); return; }

  const zone=document.getElementById('dropZone');
  if(zone){
    zone.innerHTML=`<div class="upload-state">
      <i data-lucide="upload-cloud" style="color:var(--cyan);width:34px;height:34px"></i>
      <div style="font-weight:700;margin-top:8px">Uploading ${escapeHtml(file.name)}</div>
      <div class="small" style="margin-top:7px">Sending ${humanBytes(file.size)} to Vault…</div>
      <div class="bar" style="width:min(420px,80vw);margin:14px auto 0"><b id="uploadProgress" style="width:0%"></b></div>
      <div class="small" id="uploadStatus" style="margin-top:8px">Starting upload…</div>
      <button class="btn btn-sm" id="cancelUpload" type="button" style="margin-top:12px">Cancel</button>
    </div>`;
    try{lucide.createIcons()}catch(_){ }
  }

  const rf=Math.max(1,parseInt(String(state.settings.replication).replace('x',''),10)||3);
  const fd=new FormData();
  fd.append('file',file,file.name);
  fd.append('replicationFactor',String(rf));

  const xhr=new XMLHttpRequest();
  xhr.open('POST',`${VAULT_API}/api/objects`,true);
  xhr.responseType='json';
  xhr.timeout=15*60*1000;

  let cancelled=false;
  const cancel=document.getElementById('cancelUpload');
  if(cancel) cancel.onclick=()=>{cancelled=true;xhr.abort();};

  xhr.upload.onprogress=(e)=>{
    if(!e.lengthComputable) return;
    const pct=Math.round((e.loaded/e.total)*100);
    const bar=document.getElementById('uploadProgress');
    const status=document.getElementById('uploadStatus');
    if(bar) bar.style.width=pct+'%';
    if(status) status.textContent=`Uploading… ${pct}%`;
  };

  xhr.onerror=()=>{
    if(cancelled) return;
    toast('Upload failed: the Vault server could not be reached. Make sure npm start is running.');
    refreshVault();
  };
  xhr.ontimeout=()=>toast('Upload timed out. Check the server and try again.');
  xhr.onabort=()=>{ if(!cancelled) toast('Upload was interrupted.'); };

  xhr.onload=async()=>{
    let data=xhr.response;
    if(!data){try{data=JSON.parse(xhr.responseText||'{}')}catch(_){data={}}}
    if(xhr.status>=200 && xhr.status<300){
      addEvent('OBJECT UPLOAD COMPLETED',data.object?.objectId||file.name,'Cluster','Success','Node');
      toast(`${file.name} uploaded successfully.`);
      await refreshVault();
    }else{
      const message=data?.error || `Upload failed (HTTP ${xhr.status})`;
      toast(message);
      await refreshVault();
    }
  };
  xhr.send(fd);
}

async function downloadBackend(objectId){
  try{
    const res=await fetch(`${VAULT_API}/api/objects/${encodeURIComponent(objectId)}`);
    if(!res.ok){const d=await res.json().catch(()=>({}));throw new Error(d.error||`HTTP ${res.status}`)}
    const blob=await res.blob(), url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url;
    a.download=state.objects.find(x=>x.id===objectId)?.name||objectId;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    addEvent('MULTI-NODE OBJECT RETRIEVAL',objectId,'Cluster','Success','Node');
    toast('Object reconstructed from healthy replicas.');
  }catch(e){toast('Download failed: '+e.message)}
}
async function verifyObjectBackend(objectId){
  try{
    const r=await api(`/api/objects/${encodeURIComponent(objectId)}/verify`);
    addEvent(r.healthy?'OBJECT INTEGRITY VERIFIED':'INTEGRITY ISSUE DETECTED',objectId,'Cluster',r.healthy?'Success':'Warning','Integrity');
    toast(r.healthy?'SHA-256 verification passed.':'Integrity issue detected; repair queued.');
    await refreshVault();
  }catch(e){toast('Verification failed: '+e.message)}
}
async function repairBackend(objectId){
  try{
    const r=await api('/api/repair',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(objectId?{objectId}:{})});
    addEvent('REPAIR PASS COMPLETED',objectId||'Cluster','Cluster','Success','Repair');
    toast(`Repair completed: ${r.repaired||0} chunk(s) repaired.`);
    await refreshVault();
  }catch(e){toast('Repair failed: '+e.message)}
}
async function verifyAllBackend(){
  try{
    const r=await api('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    addEvent('GLOBAL INTEGRITY VERIFICATION','—','Cluster',r.unhealthy?'Warning':'Success','Integrity');
    toast(`Verified ${r.checked} object(s): ${r.healthy} healthy, ${r.unhealthy} unhealthy.`);
    await refreshVault();
  }catch(e){toast('Verification failed: '+e.message)}
}
async function rebalanceBackend(){
  try{
    const r=await api('/api/rebalance',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    addEvent('REBALANCING PASS COMPLETED','—','Cluster','Success','Rebalancing');
    toast(`Rebalancing pass complete: ${r.repaired||0} placement(s) repaired.`);
    await refreshVault();
  }catch(e){toast('Rebalancing failed: '+e.message)}
}
async function metadataBackend(objectId){
  try{
    state.selectedObject=await api(`/api/objects/${encodeURIComponent(objectId)}/metadata`);
    state.route='Object Detail'; render();
  }catch(e){toast('Metadata failed: '+e.message)}
}
async function deleteBackend(objectId){
  try{
    await api(`/api/objects/${encodeURIComponent(objectId)}`,{method:'DELETE'});
    addEvent('OBJECT DELETED',objectId,'Cluster','Success','Node');
    toast('Object deleted from all replicas.');
    await refreshVault();
  }catch(e){toast('Delete failed: '+e.message)}
}
function detailView(){
  const o=state.selectedObject;
  if(!o) return heading('Object Metadata','Select an object from the registry.',`<button class="btn" data-route="Objects">← Back to Objects</button>`);
  const rows=(o.chunks||[]).slice(0,100).map(c=>{
    const reps=(c.replicas||[]).map(x=>x.replace(/^node-/,'Node-'));
    return `<tr><td class="mono">Chunk ${String(c.index).padStart(4,'0')}</td><td class="mono">${(c.checksum||'').slice(0,16)}...</td><td>${reps[0]||'—'}</td><td>${reps[1]||'—'}</td><td>${reps[2]||'—'}</td><td>${badge(reps.length>=Number(o.replicationFactor||3)?'Healthy':'Repair')}</td></tr>`;
  }).join('');
  const replicas=[...new Set((o.chunks||[]).flatMap(c=>c.replicas||[]))];
  return heading(o.originalName||o.objectId,'Live metadata from the Vault backend.',`<button class="btn" data-route="Objects">← Back to Objects</button>`)
  +`<section class="dashboard-grid"><article class="panel"><div style="display:flex;justify-content:space-between"><div><div class="section-title">${o.originalName||o.objectId}</div><div class="small mono" style="margin-top:4px">${o.objectId} · SHA-256 ${o.objectChecksum}</div></div>${badge('Healthy')}</div>
  <div class="map-grid"><div class="map-lane"><div class="eyebrow">CHUNKS</div>${(o.chunks||[]).slice(0,12).map(c=>`<div class="chunk-block">CHUNK ${String(c.index).padStart(4,'0')}<div style="color:#75ccea;margin-top:3px">${humanBytes(c.size)} · VERIFIED</div></div>`).join('')}${o.chunkCount>12?`<div class="small">+ ${o.chunkCount-12} more chunks</div>`:''}</div>
  <div class="map-lane"><div class="eyebrow">REPLICA PATHS</div>${(o.chunks||[]).slice(0,8).map((c,i)=>`<div class="replica-route"><span class="route-dot" style="animation-delay:${i*.24}s"></span>${(c.replicas||[]).map((r,j)=>`<span class="replica-badge">R${j+1} ${r.replace(/^node-/,'Node-')}</span>`).join('')}</div>`).join('')}</div>
  <div class="map-lane"><div class="eyebrow">STORAGE NODES</div>${replicas.map(x=>`<div class="chunk-block" style="border-color:#775fdd;background:#191b3d">${x.replace(/^node-/,'Node-')}<div style="color:#c5bbff;margin-top:3px">REPLICA AVAILABLE</div></div>`).join('')}</div></div></article>
  <aside class="panel"><div class="section-title">Storage distribution</div><div class="iso-wrap"><div class="iso-stack"><div class="iso-layer"></div><div class="iso-layer"></div><div class="iso-layer"></div></div></div><div class="node-detail"><div class="detail-line"><span>Object size</span><b>${humanBytes(o.size)}</b></div><div class="detail-line"><span>Chunk count</span><b>${o.chunkCount}</b></div><div class="detail-line"><span>Expected replicas</span><b>${o.replicationFactor}</b></div><div class="detail-line"><span>Version</span><b>${o.version}</b></div><div class="detail-line"><span>Retrieval</span>${badge('Consistent')}</div></div></aside></section>
  <article class="panel" style="margin-top:16px"><div class="section-title">Chunk distribution</div><div class="table-wrap"><table class="data-table"><thead><tr><th>CHUNK</th><th>CHECKSUM</th><th>REPLICA 1</th><th>REPLICA 2</th><th>REPLICA 3</th><th>STATUS</th></tr></thead><tbody>${rows}</tbody></table></div></article>`;
}
function dashboard(){
  const s=state.backend?.stats||{};
  const health=state.backendFaultTolerance??0;
  const used=s.usedBytes||0, total=s.totalCapacityBytes||1;
  const storagePct=Math.round(used/total*100);
  const healthy=s.healthyNodes??state.nodes.filter(n=>n.status==='Healthy').length;
  const totalNodes=s.nodeCount??state.nodes.length;
  const rf=s.replicationFactor??3;
  return heading('Vault Distributed Storage','Fault-tolerant object storage visualized as a live distributed system.')
  +`<section class="dashboard-grid"><article class="panel">
  <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="section-title">Object lifecycle / live placement fabric</div><div class="section-sub">One object becomes independently recoverable placement units across the cluster.</div></div>${badge('LIVE SIGNAL')}</div>
  <div class="flow-canvas"><div class="flow-steps">${['DATA','CHUNKS','REPLICAS','STORAGE NODES','SELF-REPAIR'].map(x=>`<div class="flow-label">${x}</div>`).join('')}</div>
  <svg class="flow-svg" viewBox="0 0 900 350" preserveAspectRatio="none"><path class="trace" d="M105 165 C210 165 215 135 300 135 M105 165 C205 165 220 210 300 210"/><path class="trace trace-violet" d="M347 135 C00 90 460 90 515 100 M347 135 C00 155 460 155 515 160 M347 210 C00 220 460 220 515 220"/><path class="trace" d="M555 100 C650 80 685 60 770 70 M555 160 C650 135 685 150 770 145 M555 220 C650 250 680 245 770 245"/><path class="trace trace-repair" d="M790 205 C850 245 842 292 770 296"/><circle class="particle" cx="190" cy="165" r="4"/><circle class="particle" cx="453" cy="145" r="4"/><circle class="particle" cx="680" cy="10" r="4"/></svg>
  <div class="flow-stage stage-data"><i data-lucide="package-open"></i><span class="mono" style="display:block;margin-top:5px">VAULT OBJECT</span></div>
  <div class="stage-chunks">${[1,2,3,4].map(x=>`<div class="chunk"></div>`).join('')}</div>
  <div class="stage-replicas">${['A','B','C','D','E','F'].map(x=>`<div class="replica">${x}</div>`).join('')}</div>
  <div class="storage-cluster">${state.nodes.map(n=>`<div class="storage-node" style="${n.status==='Failed'?'border-color:#ff607a;color:#ffabb8':''}">${n.id.replace('Node-','N')}</div>`).join('')}</div>
  <div class="repair-core"><div class="repair-ring"><i data-lucide="wrench" style="width:18px"></i></div>VERIFY · COPY · HEAL</div></div>
  <div class="mini-readouts"><div class="readout"><div class="eyebrow">OBJECTS</div><strong>${s.objectCount??state.objects.length}</strong><div class="small">live backend count</div></div><div class="readout"><div class="eyebrow">REPLICATION</div><strong>${rf}x</strong><div class="small">durability policy</div></div><div class="readout"><div class="eyebrow">STORAGE USED</div><strong>${humanBytes(used)}</strong><div class="small">${storagePct}% of cluster capacity</div></div></div>
  </article>
  <aside class="panel"><div class="section-title">Cluster health aperture</div><div class="section-sub">Live values from the Vault backend.</div>
  <div class="health-dial"><svg viewBox="0 0 160 160"><circle class="dial-bg" cx="80" cy="80" r="68"></circle><circle class="dial-main" cx="80" cy="80" r="68" style="stroke-dashoffset:${426-(426*health/100)}"></circle><circle class="dial-red" cx="80" cy="80" r="68"></circle></svg><div class="dial-copy"><strong>${health}%</strong><span>FAULT TOLERANT</span></div></div>
  <div class="node-detail"><div class="detail-line"><span>Metadata quorum</span>${badge('Consistent')}</div><div class="detail-line"><span>SHA-256 engine</span><b>ACTIVE</b></div><div class="detail-line"><span>Healthy nodes</span><b>${healthy} / ${totalNodes}</b></div><div class="detail-line"><span>Cluster free</span><b>${humanBytes(s.freeBytes||0)}</b></div></div>
  <button class="btn btn-primary" data-route="Network" style="width:100%;margin-top:16px">Inspect cluster topology</button></aside></section>
  <section class="dashboard-lower"><article class="panel"><div class="section-title">Six-node storage constellation</div><div class="section-sub">Capacity, health and independent node placement from the live backend.</div>${nodeMap()}</article>
  <article class="panel"><div class="section-title">Operational trace</div><div class="section-sub">Recent UI events</div><div class="event-list">${state.events.slice(0,5).map(e=>`<div class="event-row"><span class="event-pin"></span><div><b>${e.event}</b><div class="small" style="margin-top:3px">${e.object} · ${e.node}</div></div><span class="mono" style="color:#87a8c4">${e.time}</span></div>`).join('')}</div></article></section>`;
}

/* Capture backend actions before the original Canva demo handlers. */
document.addEventListener('click', async e=>{
  const a=e.target.closest('[data-action]');
  if(a){
    const action=a.dataset.action, id=a.dataset.node, obj=a.dataset.object;
    if(['fail','recover','partition','heal'].includes(action)){
      e.preventDefault();e.stopImmediatePropagation();
      if(action==='fail'||action==='partition'){
        confirmAction(action==='fail'?'Fail storage node?':'Create network partition?',`${id} will enter a simulated ${action==='fail'?'failure':'partition'} state.`,()=>backendNodeAction(action,id));
      }else await backendNodeAction(action,id);
      return;
    }
    if(action==='download'){e.preventDefault();e.stopImmediatePropagation();await downloadBackend(obj);return}
    if(action==='metadata'){e.preventDefault();e.stopImmediatePropagation();await metadataBackend(obj);return}
    if(action==='verify-object'){e.preventDefault();e.stopImmediatePropagation();await verifyObjectBackend(obj);return}
    if(action==='repair-object'){e.preventDefault();e.stopImmediatePropagation();await repairBackend(obj);return}
    if(action==='reconcile'){e.preventDefault();e.stopImmediatePropagation();await rebalanceBackend();return}
  }
  if(e.target.id==='verifyAll'){e.preventDefault();e.stopImmediatePropagation();await verifyAllBackend();return}
  if(e.target.id==='startRebalance'){e.preventDefault();e.stopImmediatePropagation();await rebalanceBackend();return}
  if(e.target.id==='delete-object'){e.preventDefault();e.stopImmediatePropagation();await deleteBackend(e.target.dataset.object);return}
},true);

/* Do not intercept the file input change event here. The upload handler below
   must receive the native file selection event. */
nodeAction=backendNodeAction;
simulateUpload=backendUpload;

/* Robust upload integration. The visible label opens the native picker;
   drag-and-drop is handled here and both paths use the real backend. */
document.addEventListener('keydown',e=>{
  const zone=e.target.closest('#dropZone');
  if(zone && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); document.getElementById('filePicker')?.click(); }
}, true);

document.addEventListener('click',e=>{
  const zone=e.target.closest('#dropZone');
  if(zone && e.target.id!=='filePicker'){
    zone.classList.remove('drag');
  }
}, true);

document.addEventListener('change',e=>{
  if(e.target.id!=='filePicker') return;
  const file=e.target.files && e.target.files[0];
  if(file) backendUpload(file);
  e.target.value='';
}, true);

document.addEventListener('dragover',e=>{
  const zone=e.target.closest('#dropZone');
  if(!zone)return;
  e.preventDefault();
  e.stopPropagation();
  zone.classList.add('drag');
}, true);

document.addEventListener('drop',e=>{
  const zone=e.target.closest('#dropZone');
  if(!zone)return;
  e.preventDefault();
  e.stopPropagation();
  zone.classList.remove('drag');
  const file=e.dataTransfer?.files?.[0];
  if(file) backendUpload(file);
}, true);

(async()=>{
  await refreshVault({rerender:false});
  render();
  setInterval(()=>refreshVault({rerender:true}),8000);
})();
</script>
